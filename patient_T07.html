button,.btn{font:inherit;min-height:46px;padding:8px 16px;border-radius:6px;border:2px solid var(--g);background:transparent;color:var(--g);cursor:pointer;text-align:center}

const SUPS = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"+"};
/* Reads 1.28e10, 1.28E10, 1.28*10^10, 1.28 x 10^10, 1.28·10^10, 1.28×10¹⁰, 1.28*10**10, 10^(10), 1,28e10, 12791007303. NaN if unreadable. */
const num = (raw) => {
  let s = String(raw).trim().replace(/−/g, "-").replace(/\s+/g, "");
  s = s.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+)/g, (m, e) => "10^" + [...e].map(c => SUPS[c]).join(""));
  s = s.replace(/\^\(([^)]*)\)/g, "^$1");
  const commas = (s.match(/,/g) || []).length;
  s = (commas === 1 && !s.includes(".")) ? s.replace(",", ".") : s.replace(/,/g, "");
  s = s.replace(/(?:\*|×|x|X|·|⋅)10(?:\^|\*\*)/, "e").replace(/^10(?:\^|\*\*)/, "1e");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return NaN;
  return Number(s);
};

/* ===== Scope plot: the beam draws each series ============================= */
function plot(cv, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const m = {l:58, r:14, t:14, b:40}, pw = W-m.l-m.r, ph = H-m.t-m.b;
  const tx = o.xlog ? v => (Math.log10(v)-Math.log10(o.xr[0]))/(Math.log10(o.xr[1])-Math.log10(o.xr[0])) : v => (v-o.xr[0])/(o.xr[1]-o.xr[0]);
  const ty = o.ylog ? v => (Math.log10(v)-Math.log10(o.yr[0]))/(Math.log10(o.yr[1])-Math.log10(o.yr[0])) : v => (v-o.yr[0])/(o.yr[1]-o.yr[0]);
  const X = v => m.l + tx(v)*pw, Y = v => m.t + ph - ty(v)*ph;
  g.strokeStyle = "#1F5C3A"; g.lineWidth = 1; g.fillStyle = "#8FD9AE"; g.font = "12px 'Share Tech Mono', monospace";
  (o.xticks||[]).forEach(v => { g.beginPath(); g.moveTo(X(v), m.t); g.lineTo(X(v), m.t+ph); g.stroke(); g.fillText(String(v), X(v)-10, H-22); });
  (o.yticks||[]).forEach(v => { g.beginPath(); g.moveTo(m.l, Y(v)); g.lineTo(m.l+pw, Y(v)); g.stroke(); g.fillText(fmt(v,2), 4, Y(v)+4); });
  g.fillText(o.xlabel||"", m.l+pw/2-30, H-4);
  if (o.vline){ g.setLineDash([4,4]); g.strokeStyle="#B9FFD5"; g.beginPath(); g.moveTo(X(o.vline[0]), m.t); g.lineTo(X(o.vline[0]), m.t+ph); g.stroke(); g.setLineDash([]); g.fillStyle="#B9FFD5"; g.fillText(o.vline[1], X(o.vline[0])+4, m.t+14); }
  const inR = (x,y) => x>=o.xr[0] && x<=o.xr[1] && y>=o.yr[0] && y<=o.yr[1];
  let k = 0; const total = 50;
  function frame(){
    k++; const f = Math.min(1, k/total);
    o.series.forEach(s => {
      g.save(); g.strokeStyle = s.color; g.fillStyle = s.color; g.lineWidth = s.w||2.5; g.shadowColor = s.color; g.shadowBlur = 8;
      if (s.dash) g.setLineDash(s.dash);
      const n = Math.max(1, Math.floor(s.x.length*f));
      if (s.dots){ for(let i=0;i<n;i++) if(inR(s.x[i],s.y[i])){ g.beginPath(); g.arc(X(s.x[i]),Y(s.y[i]),s.r||3.5,0,7); g.fill(); } }
      else { g.beginPath(); let st=false; for(let i=0;i<n;i++){ if(!inR(s.x[i],s.y[i])) continue; const px=X(s.x[i]),py=Y(s.y[i]); st?g.lineTo(px,py):g.moveTo(px,py); st=true; } g.stroke(); }
      g.restore();
    });
    if (f < 1) requestAnimationFrame(() => { g.clearRect(0,0,W,H); redrawAxes(); frame(); });
  }
  function redrawAxes(){
    g.strokeStyle = "#1F5C3A"; g.lineWidth = 1; g.fillStyle = "#8FD9AE";
    (o.xticks||[]).forEach(v => { g.beginPath(); g.moveTo(X(v), m.t); g.lineTo(X(v), m.t+ph); g.stroke(); g.fillText(String(v), X(v)-10, H-22); });
    (o.yticks||[]).forEach(v => { g.beginPath(); g.moveTo(m.l, Y(v)); g.lineTo(m.l+pw, Y(v)); g.stroke(); g.fillText(fmt(v,2), 4, Y(v)+4); });
    g.fillText(o.xlabel||"", m.l+pw/2-30, H-4);
    if (o.vline){ g.setLineDash([4,4]); g.strokeStyle="#B9FFD5"; g.beginPath(); g.moveTo(X(o.vline[0]), m.t); g.lineTo(X(o.vline[0]), m.t+ph); g.stroke(); g.setLineDash([]); g.fillStyle="#B9FFD5"; g.fillText(o.vline[1], X(o.vline[0])+4, m.t+14); }
  }
  frame();
}

/* --- generic pieces of an exhibit ---------------------------------------- */
function calcBlock(k, id, prompt, unit, truth, tol, hints){
  const st = ex(k); const done = st.done[id];
  const el = $(`<div class="panel"><h3>${prompt}</h3>
    <div class="row"><div><label for="${id}">your value ${unit?"["+unit+"]":""}</label><input id="${id}" inputmode="decimal" ${done?"disabled":""} value="${done?fmt(done.v,4):""}"></div>
    <div style="display:flex;align-items:flex-end"><button id="${id}b" ${done?"disabled":""}>Check</button></div></div><div id="${id}f"></div></div>`);
  const f = el.querySelector("#"+id+"f");
  if (done) f.append($(`<div class="fb">${id==="b0" ? "Using a = "+fmtH(done.v,3)+"." : (done.assisted ? "Shown after five tries (assisted): " : "Matches the team's own calculation: ") + fmtH(truth(),4)+" "+unit}</div>`));
  el.querySelector("#"+id+"b").onclick = () => {
    const v = num(el.querySelector("#"+id).value); if (isNaN(v)){ f.innerHTML = ""; f.append($(`<div class="fb bad">Couldn't read that number. Write it as 1.28e10 or 1.28*10^10.</div>`)); return; }
    const t = truth(); st.tries[id] = (st.tries[id]||0) + 1;
    if (rel(v,t) <= tol){ st.done[id] = { v, assisted:false }; post("calc", k, id+":ok:"+st.tries[id], ""); S.scrollNext = true; render(); return; }
    const n = st.tries[id];
    if (n >= 5){ st.done[id] = { v:t, assisted:true }; st.assisted = true; post("calc", k, id+":assisted", ""); S.scrollNext = true; render(); return; }
    f.innerHTML = ""; f.append($(`<div class="fb bad">${v>t?"Too high":"Too low"} (by a factor ${fmtH(Math.max(v/t,t/v),2)}). ${hints[Math.min(n,3)-1]}${n===4?" (One more wrong try shows the value, marked assisted.)":""}</div>`)); save();
  };
  return el;
}
function commitBlock(k, question, onDone){
  const st = ex(k);
  const el = $(`<div class="panel"><h3>Commit before the test: ${question}</h3>
    <div class="pills" id="v"></div><div class="pills" id="c"></div>
    <button class="primary" id="run" disabled>Run the test (uses 1 of ${S.tests})</button> <span class="muted" id="why"></span></div>`);
  const v = el.querySelector("#v"), c = el.querySelector("#c"), run = el.querySelector("#run");
  const why = el.querySelector("#why");
  const upd = () => { run.disabled = !(st.commit && st.conf) || S.tests <= 0;
    why.textContent = S.tests <= 0 ? "No lab tests left." : !st.commit && !st.conf ? "Pick a call and a confidence first." : !st.commit ? "Pick a call (the cause, or ruled out)." : !st.conf ? "Pick how sure you are." : ""; };
  [["guilty","The cause"],["cleared","Ruled out"]].forEach(([id,l]) => { const b = $(`<button class="amber ${st.commit===id?"on":""}">${l}</button>`); b.onclick = () => { st.commit=id; v.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); upd(); save(); }; v.append(b); });
  CONF.forEach(([id,l]) => { const b = $(`<button class="${st.conf===id?"on":""}">${l}</button>`); b.onclick = () => { st.conf=id; c.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); upd(); save(); }; c.append(b); });
  upd();
  run.onclick = () => { S.tests--; st.step = "lab"; post("commit", k, st.commit, st.conf); onDone(); S.scrollNext = true; render(); };
  return el;
}
function backBtn(){ const b = $(`<button>← Back to the whiteboard</button>`); b.onclick = () => { S.step = "board"; render(); }; return b; }
function closeBtn(k){
  const b = $(`<button class="primary">Stamp it and return to the board →</button>`);
  b.onclick = () => { ex(k).step = "closed"; post("closed", k, TESTS[k].truth, ex(k).conf); S.step = "board"; render(); }; return b;
}
function outcome(k, why, next){
  const st = ex(k), right = st.commit === TESTS[k].truth;
  return $(`<div class="panel"><span class="stamp ${TESTS[k].truth}">${CALL[TESTS[k].truth]}</span>
    <p>${right ? "Your call matches the test." : "The test goes against your call."} You were <b>${CONF.find(c=>c[0]===st.conf)[1].toLowerCase()}</b>.</p>
    <div class="fb"><b>Why:</b> ${why}</div><div class="fb"><b>Next:</b> ${next}</div></div>`);
}
function allCalcsDone(k, ids){ const d = ex(k).done; return ids.every(i => d[i]); }

/* --- the six tests, in the order of the lecture ----------------------------- */
function exhibit(){
  const k = S.step.split(":")[1], e = TESTS[k], st = ex(k), c = EX[e.cause];
  const el = $(`<div>${header()}<div class="panel"><button id="back">← whiteboard</button>
     <h2 class="glow" style="margin-top:10px">TEST ${k.slice(1)} · ${e.name}</h2><p class="muted">${e.step} · checks cause ${e.cause}: ${c.name} · ${c.term}</p><div id="intro"></div></div><div id="body"></div></div>`);
  app.append(el); el.querySelector("#back").onclick = () => { S.step = "board"; render(); };
  const intro = el.querySelector("#intro"), body = el.querySelector("#body");
  const P = (h) => intro.append($(`<div>${h}</div>`));
  const lab = (title, legend) => { const l = $(`<div class="panel"><h3>${title}</h3><canvas></canvas><div class="legend">${legend}</div></div>`); body.append(l); return l.querySelector("canvas"); };
  const sw = (col, t) => `<span><span class="sw" style="background:${col}"></span>${t}</span>`;
  const reveal = (h) => body.append($(`<div class="panel"><p>${h}</p></div>`));
  const showLab = st.step === "lab" || st.step === "closed";
  const finish = () => body.append(st.step === "lab" ? closeBtn(k) : backBtn());

  if (k === "T1"){
    const B = DATA.band;
    P(`<p>The report says its turbulence box was scaled to the site's turbulence: <span class="amb">σ_u = 1.8 m/s</span> at the hub. Here is the box's own spectrum at the hub, averaged in five bands (two-sided, course convention):</p>
       <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:15px"><tr class="muted"><td style="padding:2px 12px">ω band [rad/s]</td><td style="padding:2px 12px">mean S_u [m²/s]</td><td style="padding:2px 12px">Δω [rad/s]</td></tr>
       ${B.map(b=>`<tr><td style="padding:2px 12px">${fmt(b.lo,2)} – ${fmt(b.hi,1)}</td><td style="padding:2px 12px">${fmtH(b.S,3)}</td><td style="padding:2px 12px">${fmt(b.dw,2)}</td></tr>`).join("")}</table></div>`);
    body.append(calcBlock("T1","t1","What variance σ_u² does the box carry at the hub?","m²/s²",()=>N.level_var_from_table,0.05,
      ["Lecture 6: the variance is the area under the spectrum. A synthesis keeps it by construction.",
       "Which frequencies does a two-sided spectrum also count, and how does that change the sum over the bands?",
       "σ² = 2 Σ S̄ Δω over the five bands."]));
    if (st.done.t1 && st.step==="calc"){ reveal(`Yours: σ² = <span class="amb">${fmt(st.done.t1.v,2)}</span>, so σ_u = ${fmt(Math.sqrt(st.done.t1.v),2)} m/s · the report: σ_u = <span class="amb">1.8 m/s</span>.`); body.append(commitBlock("T1","is the box's wind level wrong?",()=>{})); }
    if (showLab){
      const share = B.map(b => 2*b.S*b.dw/N.level_var_from_table);
      const cv = lab("Test: where the box's variance sits", sw("#6DF5A4","share of σ² per band"));
      requestAnimationFrame(()=>plot(cv, { xr:[0,5], yr:[0,1], xticks:[], yticks:[0,0.25,0.5,0.75,1], xlabel:"bands 1–5, low → high ω",
        series: share.map((v,i)=>({x:[i+0.5,i+0.5], y:[0,v], color:"#6DF5A4", w:26})) }));
      body.append(outcome("T1",`the box carries the right variance (σ_u ≈ ${fmt(Math.sqrt(N.level_var_from_table),2)} m/s): the level is ruled out. But look where the variance sits: the two highest bands hold almost nothing. A right variance can still sit at the wrong frequencies.`,
        "step 3: where in frequency does the box's wind live? (Round 1, task 3)"));
      finish();
    }
  }

  if (k === "T2"){
    P(`<p>From the lab bench (Round 1, task 3): the report's box against the fine box at the hub.</p>`);
    body.append(calcBlock("T2","t2","Lab result 1: above which angular frequency is the report's box silent (less than a tenth of the fine box)?","rad/s",()=>{ const v = st.done.t2 ? st.done.t2.v : num((document.getElementById("t2")||{}).value); return (v>=1.1 && v<=2.0) ? v : 1.55; },0.0001,
      ["Round 1, task 3: plot both spectra at the hub and compare them band by band.",
       "Look at the ratio of the two spectra above about 0.3 rad/s. Where does it first drop below 0.1?",
       "Expect a value between about 1.2 and 2 rad/s."]));
    if (st.done.t2){
      reveal(`Pinned to the whiteboard: <span class="amb">the report's box goes silent above ≈ ${fmt(st.done.t2.v,2)} rad/s</span>, while its variance is right. Whether that matters depends on the patient: at what frequency does the tower respond? (step 5)`);
      if (st.step==="calc"){ const b = $(`<button class="primary">Pin it and return to the whiteboard →</button>`); b.onclick = () => { st.step = "closed"; st.commit = null; post("closed","T2","noted",""); S.step = "board"; render(); }; body.append(b); }
      else body.append(backBtn());
    }
  }

  if (k === "T3"){
    P(`<p>Load report: <span class="amb">χ²(ω₀) = ${fmt(N.chi2_meas_w0,4)}</span> at the tower frequency, "from averaging the turbulence box over the rotor disk".</p>
       <p class="muted">Given: rotor diameter D = 120 m · U = 10 m/s · tower frequency ω₀ = ${fmt(N.w0,2)} rad/s.</p>`);
    body.append(calcBlock("T3","b0","Lab result 2: your Davenport a from Round 1 (fitted at 15 m).","",()=>{ const v = st.done.b0 ? st.done.b0.v : num((document.getElementById("b0")||{}).value); return (v>=8 && v<=45) ? v : N.a_fit_15m; },0.0001,
      ["Round 1, task 4: fit Davenport at 15 m.","Davenport is written with f in Hz; did you convert from ω?","A value around 20 is typical for this box."]));
    if (st.done.b0){
      const a = st.done.b0.v;
      body.append(calcBlock("T3","b1","Treat the rotor as the line-like structure in the notes, 120 m long. What admittance χ² does it get at ω₀ with your a?","",()=>chi2Dav(N.w0,a,N.D),0.05,
        ["Chapter 7, loads on a line-like structure: the admittance compares the structure's length with a length set by the coherence.",
         "Over what distance does Davenport's coherence decay at this ω (the notes call it λ)? How does it compare with 120 m?",
         "λ_c = 4πU/(aω₀). Then χ² = 2r[r(e^(−1/r) − 1) + 1] with r = λ_c / L."]));
      if (st.done.b1 && st.step==="calc"){
        reveal(`Textbook (yours): <span class="amb">${fmt(chi2Dav(N.w0,a,N.D),3)}</span> · report: <span class="amb">${fmt(N.chi2_meas_w0,4)}</span>, about ${fmt(chi2Dav(N.w0,a,N.D)/N.chi2_meas_w0,0)}× lower.`);
        body.append(commitBlock("T3","is the report's χ² wrong?",()=>{}));
      }
    }
    if (showLab){
      const a = st.done.b0 ? st.done.b0.v : N.a_fit_15m, om = logspace(0.03, 15, 120);
      const cv = lab("Test: the true wind averaged over the 120 m rotor disk, divided by the point value", sw("#6DF5A4","true wind, rotor disk") + sw("#E6FFF0","the notes' line, 120 m, your a") + sw("#FFD36E","report at ω₀"));
      requestAnimationFrame(()=>plot(cv, { xlog:true, ylog:true, xr:[0.03,15], yr:[1e-4,1], xticks:[0.1,1,10], yticks:[1e-4,1e-3,1e-2,0.1,1], xlabel:"ω [rad/s]", vline:[N.w0,"ω₀"],
        series:[{x:DATA.chi2.om, y:DATA.chi2.chi2, dots:true, color:"#6DF5A4"}, {x:om, y:om.map(w=>chi2Dav(w,a,N.D)), color:"#E6FFF0", w:2, dash:[6,4]}, {x:[N.w0], y:[N.chi2_meas_w0], dots:true, r:7, color:"#FFD36E"}] }));
      body.append(outcome("T3",`the report's value sits on the true wind's own rotor average. The coherence in a Mann field falls faster than Davenport far apart (your Round 1), and a disk averages in two directions, not one. The notes' line formula (7.2.18) would have been <b>conservative</b>.`,
        "step 5: the tower itself."));
      finish();
    }
  }

  if (k === "T4"){
    P(`<p>The load report turns the wind spectrum into a thrust spectrum by multiplying it by one constant factor. Its value is sealed until you have your own.</p>
       <p class="muted">Given: ρ = 1.25 kg/m³ · rotor area A = 11 310 m² (D = 120 m) · C_T = 0.8 · U = 10 m/s.</p>`);
    body.append(calcBlock("T4","a1","What constant factor turns S_u(ω) into the spectrum of the thrust fluctuations?","N² s² m⁻²",()=>N.pointfactor,0.03,
      ["Chapter 7, loads on a point-like structure: the rotor's thrust has the same form as the drag there (see the primer).",
       "Write the thrust with U + u and keep only the part that is proportional to u. How does a constant gain in time show up in a spectrum?",
       "The fluctuating thrust is (ρ A C_T U)·u(t). Square that prefactor with the givens."]));
    if (st.done.a1 && st.step==="calc"){ reveal(`Yours: <span class="amb">${fmtH(st.done.a1.v)}</span> · the report's: <span class="amb">${fmtH(N.pointfactor)}</span> N² s² m⁻².`); body.append(commitBlock("T4","is the thrust factor in the report wrong?",()=>{})); }
    if (showLab){
      const cv = lab("Test: full thrust ½ρAC_T(U+u)² from the true wind, divided by its spectrum", sw("#6DF5A4","full thrust, true wind") + sw("#FFD36E","your factor"));
      requestAnimationFrame(()=>plot(cv, { xlog:true, xr:[0.03,15], yr:[0,3], xticks:[0.1,1,10], yticks:[0,1,2,3], xlabel:"ω [rad/s]   (y in units of 1e10 N²·s²/m²)",
        series:[{x:DATA.point.om, y:DATA.point.ratio, dots:true, color:"#6DF5A4"}, {x:[0.03,15], y:[st.done.a1.v/1e10, st.done.a1.v/1e10], color:"#FFD36E", dash:[6,4]}] }));
      body.append(outcome("T4",`the ratio is flat: a constant gain g in time becomes g² in the spectrum (S ∝ X X*). The full thrust sits about ${fmt(100*(N.thrust_nonlinear_mid/N.pointfactor-1),0)} % above the linear factor: the u² term the linearisation drops. The report's factor is right.`,
        "how does the tower respond to that thrust?"));
      finish();
    }
  }

  if (k === "T5"){
    P(`<p>The load report says the operating rotor adds aerodynamic damping to the tower. Its value is sealed until you have your own.</p>
       <p class="muted">Given: tower-top modal mass m = 4.0×10⁵ kg · tower frequency ω₀ = ${fmt(N.w0,2)} rad/s · structural damping η = ${fmt(N.eta,4)} s⁻¹ (1 % of critical) · ρ = 1.25 kg/m³ · A = 11 310 m² · C_T = 0.8 · U = 10 m/s.</p>`);
    body.append(calcBlock("T5","c1","How large is the aerodynamic damping η_a of the operating rotor?","s⁻¹",()=>N.eta_a,0.03,
      ["Chapter 7, the damped oscillator: what changes in the force when the structure itself moves with the wind?",
       "Write the thrust with the relative wind u − ẋ and linearise. Which term has the same form as the damping term of the oscillator?",
       "That term moves to the left-hand side and adds to 2mη: 2m η_a = ρ A C_T U."]));
    if (st.done.c1) body.append(calcBlock("T5","c2","At the tower's frequency, how many times larger would the response |H|² be with the rotor parked (η_a = 0)?","×",()=>N.H2_ratio_no_eta_a,0.04,
      ["Look at the response function of the damped oscillator, at resonance.",
       "At ω = ω₀, which term in the denominator of |H|² survives, and how does it depend on the damping?",
       "|H(ω₀)|² ∝ 1/(η + η_a)². Take the ratio with η alone."]));
    if (st.done.c2 && st.step==="calc"){ reveal(`The report: η + η_a = <span class="amb">${fmt(N.eta+N.eta_a,3)} s⁻¹</span>, included in its response function.`); body.append(commitBlock("T5","is the tower's response in the report wrong?",()=>{})); }
    if (showLab){
      const w = Array.from({length:400},(_,i)=>1.2+2.0*i/399), H2 = (x,e2)=>1/(N.mass**2*((N.w0**2-x*x)**2+4*e2*e2*x*x));
      const cv = lab("Test: the tower's response function near its mode", sw("#FF6B5E","η only (rotor parked)") + sw("#6DF5A4","η + η_a (rotor operating), the report's"));
      requestAnimationFrame(()=>plot(cv, { ylog:true, xr:[1.2,3.2], yr:[1e-13,1e-9], xticks:[1.2,1.7,2.2,2.7,3.2], yticks:[1e-13,1e-11,1e-9], xlabel:"ω [rad/s]", vline:[N.w0,"ω₀"],
        series:[{x:w, y:w.map(x=>H2(x,N.eta)), color:"#FF6B5E"}, {x:w, y:w.map(x=>H2(x,N.eta+N.eta_a)), color:"#6DF5A4"}] }));
      body.append(outcome("T5",`an operating rotor damps its own tower: η_a is ${fmt(N.eta_a/N.eta,1)}× the structural damping, and the report included it. Leaving it out would have been about ${fmt(N.H2_ratio_no_eta_a,0)}× more conservative. Note where the tower responds: at ω₀ = ${fmt(N.w0,2)} rad/s.`,
        "compare that with what you pinned in test 2."));
      finish();
    }
  }

  if (k === "T6"){
    const sil = S.ex.T2 && S.ex.T2.done.t2 ? S.ex.T2.done.t2.v : null;
    P(`<p>On the whiteboard: the report's box goes silent above <span class="amb">≈ ${sil?fmt(sil,2):"?"} rad/s</span> (test 2); the tower responds at <span class="amb">ω₀ = ${fmt(N.w0,2)} rad/s</span> (test 5). Box header: <span class="amb">256 × 32 × 32 points · 6144 m along the wind · U = 10 m/s</span>.</p>`);
    body.append(calcBlock("T6","d1","Why there? What is the highest angular frequency this box can feed the turbine?","rad/s",()=>N.om_max,0.04,
      ["Lecture 6: what limits the highest frequency in a sampled record? Here the sampling is in space, not in time.",
       "How long is one grid cell along the wind, and what is the shortest wave a grid can hold? How do you turn a wavenumber into a frequency (Round 1, task 2)?",
       "Δx = 6144 m / 256; k_max = π/Δx; ω = U k."]));
    if (st.done.d1 && st.step==="calc"){ reveal(`Box limit: <span class="amb">${fmt(N.om_max,2)} rad/s</span> · tower mode: <span class="amb">ω₀ = ${fmt(N.w0,2)} rad/s</span>.`); body.append(commitBlock("T6","is the turbulence box the cause?",()=>{})); }
    if (showLab){
      const B = DATA.box;
      const cv = lab("Test: the wind at the hub, true wind vs the report's box", sw("#6DF5A4","true wind (fine box, Δx = 1.5 m)") + sw("#FF6B5E","report's box (Δx = 24 m)") + sw("#FFD36E","the box's limit"));
      requestAnimationFrame(()=>plot(cv, { xlog:true, ylog:true, xr:[0.02,15], yr:[1e-7,100], xticks:[0.1,1,10], yticks:[1e-6,1e-4,1e-2,1,100], xlabel:"ω [rad/s]", vline:[N.w0,"ω₀"],
        series:[{x:B.om, y:B.S_ref, color:"#6DF5A4"}, {x:B.om, y:B.S_box, color:"#FF6B5E"}, {x:[N.om_max,N.om_max], y:[1e-7,100], color:"#FFD36E", w:1.5, dash:[5,4]}] }));
      body.append(outcome("T6",`a 24 m grid holds no eddies shorter than 48 m, so the box has almost no wind above ${fmt(N.om_max,2)} rad/s. The tower responds at ${fmt(N.w0,2)} rad/s, past the cliff: the simulation never shook it at its own frequency. Scaling the box to the right σ_u only moved the missing energy to low frequencies. With the true wind, the tower-top acceleration is ${fmt(N.accel_truth_over_design,1)}× the design value.`,
        "make the diagnosis when the lecture gives the diagnosis code."));
      finish();
    }
  }
}

function verdict(){
  const el = $(`<div>${header()}<div class="panel"><h2 class="glow">DIAGNOSIS</h2><p>Which cause explains the symptom?</p>
    <div class="pills" id="v"></div><div class="pills" id="c"></div><button class="primary" id="ok" disabled>Make the diagnosis</button></div></div>`);
  app.append(el); let pick = null, conf = null; const ok = el.querySelector("#ok"), upd = () => ok.disabled = !(pick && conf);
  Object.entries(EX).forEach(([k,e]) => { const b = $(`<button class="amber">${k} · ${e.term}</button>`); b.onclick = () => { pick = k; el.querySelectorAll("#v button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); upd(); }; el.querySelector("#v").append(b); });
  CONF.forEach(([id,l]) => { const b = $(`<button>${l}</button>`); b.onclick = () => { conf = id; el.querySelectorAll("#c button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); upd(); }; el.querySelector("#c").append(b); });
  ok.onclick = () => { S.verdict = { pick, conf }; post("verdict", pick, "", conf); S.step = "summary"; render(); };
}

function summary(){
  const called = Object.keys(TESTS).filter(t => TESTS[t].truth !== "noted");
  const rows = called.map(k => { const st = S.ex[k]||{}; const right = st.commit === TESTS[k].truth;
    return `<tr><td>${k.slice(1)} · ${TESTS[k].name}</td><td>${st.commit ? CALL[st.commit].toLowerCase() : "—"}</td><td>${(CONF.find(c=>c[0]===st.conf)||["","—"])[1]}</td><td class="${right?"":"amb"}">${right?"matched":"did not match"}</td><td>${st.assisted?"assisted":""}</td></tr>`; }).join("");
  const sure = called.filter(k => S.ex[k] && S.ex[k].conf === "bet"), sureRight = sure.filter(k => S.ex[k].commit === TESTS[k].truth).length;
  app.append($(`<div>${header()}<div class="panel"><h2 class="glow">CASE NOTES</h2>
    <p>Your diagnosis: <span class="amb">${S.verdict.pick}</span> · ${S.verdict.pick==="D" ? "the turbulence box. The load chain was right; its wind had nothing at the tower's frequency." : "the tests pointed to D, the turbulence box."}</p>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px"><tr class="muted"><td>test</td><td>your call</td><td>confidence</td><td>test</td><td></td></tr>${rows}</table></div>
    <div class="fb"><b>Calibration:</b> you were "I'd bet my thesis" sure ${sure.length} time(s) and right ${sureRight} time(s). Exit-ticket question 3 asks you to reflect on this: was your confidence a good guide?</div>
    <div class="fb"><b>Reality check:</b> this was a quick spectral check. Real certification uses IEC turbulence models and aeroelastic simulation, and box resolution is one of the settings to get right there too.</div>
    <div class="fb"><b>Epilogue:</b> Next patient: the class's own Østerild record has an unexplained deficit in S_w/S_u. Back to the slides.</div></div></div>`));
}

/* ===== Projector view: ?view=board ======================================== */
function projector(){
  document.body.style.fontSize = "22px";
  app.innerHTML = `<div class="top"><span class="glow">PATIENT T07 · CLASS WHITEBOARD · ${SESSION}</span><span id="teams" class="amb"></span></div>
    <div class="row"><div class="panel"><h2>First hunch</h2><div id="sus"></div></div><div class="panel"><h2>Calls per test (the cause / ruled out)</h2><div id="com"></div></div></div>
    <div class="panel"><h2>Diagnoses <button id="rv" style="margin-left:12px">Reveal</button></h2><div id="ver" class="hidden"></div></div>
    <p class="muted">${API_URL ? "Live: refreshes every 5 s." : "Offline: API_URL is empty in patient_T07.html, so no class data is collected."}</p>`;
  document.getElementById("rv").onclick = () => document.getElementById("ver").classList.toggle("hidden");
  const bars = (id, counts) => { const tot = Object.values(counts).reduce((a,b)=>a+b,0) || 1;
    document.getElementById(id).innerHTML = Object.keys(EX).map(k => `<div class="barrow"><span>${k} · ${EX[k].term}</span><div class="bar" style="width:${100*(counts[k]||0)/tot}%"></div><span>${counts[k]||0}</span></div>`).join(""); };
  async function tick(){
    if (!API_URL) return;
    try { const r = await fetch(API_URL + "?action=summary&session=" + encodeURIComponent(SESSION)); const d = await r.json();
      document.getElementById("teams").textContent = d.teams + " teams";
      bars("sus", d.suspect||{}); bars("ver", d.verdict||{});
      document.getElementById("com").innerHTML = Object.keys(TESTS).filter(k => TESTS[k].truth !== "noted").map(k => { const c = (d.commit||{})[k]||{guilty:0,cleared:0};
        return `<div class="barrow"><span>Test ${k.slice(1)} · ${TESTS[k].name}</span><span><span class="redt">${c.guilty} the cause</span> / ${c.cleared} ruled out</span><span></span></div>`; }).join("");
    } catch(e){}
  }
  tick(); setInterval(tick, 5000);
}

if (Q.get("view") === "board") projector(); else { try { history.replaceState({ step:S.step }, "", location.search); } catch(e){} render(true); }
